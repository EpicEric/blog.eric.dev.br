on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: true
          submodules: true
      - name: Setup Zola
        uses: taiki-e/install-action@3ae7038495f79cd771208b38319ff728a8b24538 # v2.67.3
        with:
          tool: zola
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: zola build
      - name: Deploy to Sandhole
        if: github.ref == 'refs/heads/main'
        uses: up9cloud/action-rsync@e5f52e6a78755fa0ddbfd2d52f61de0490661665 # master
        env:
          SOURCE: public/
          HOST: ${{ secrets.WEBSITE_SSH_HOST }}
          PORT: ${{ secrets.WEBSITE_SSH_PORT }}
          USER: ${{ secrets.WEBSITE_SSH_USER }}
          KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          TARGET: ${{ secrets.WEBSITE_SSH_TARGET }}
